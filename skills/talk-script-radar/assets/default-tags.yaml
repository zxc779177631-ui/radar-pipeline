# 耐久种子标签（可增删，不绑死客户）
# daily：发现层会在这些种子上再长出 emergent 子话题
# collect：用户没给词时，从这里挑

durable_seeds:
  - 企业融资
  - 商业避坑
  - 老板思维
  - 创始人IP
  - 营销咨询
  - AI工具
  - 教育培训
  - 品牌增长

exclude:
  - 数字人
  - 数字分身
  - 访谈节目
  - 程前朋友圈
  - 对谈访谈

notes: |
  禅商只是人设，不是内容领域。
  刘总方向用：商业/老板 + 融资/企业服务/避坑/行业信息。
  排除=标题/关键词命中就跳过，不当范文。
  访谈/程前朋友圈：重策划对谈，没法单人口播模仿。
  数字人/数字分身：教程和工具片，不是口播范文。
  实习生/找工作：不要排除，主题进「职场」，不要丢进商业。
