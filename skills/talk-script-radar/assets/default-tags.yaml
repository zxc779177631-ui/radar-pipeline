# 耐久种子标签（可增删，不绑死客户）
# daily：发现层会在这些种子上再长出 emergent 子话题
# collect：用户没给词时，从这里挑

durable_seeds:
  - 企业融资
  - 商业避坑
  - 老板思维
  - 创始人IP
  - 营销咨询
  - AI工具
  - 教育培训
  - 品牌增长

exclude:
  - 数字人
  - 数字分身
  - 访谈节目
  - 程前朋友圈
  - 对谈访谈
  - 跳舞
  - 变装
  - BGM
  - 翻唱
  - 街拍
  - 跑酷
  - 舞蹈
  - 特效
  - 快闪
  - 广场舞
  - 手势舞
  - 魔术
  - 穿搭展示
  - 健身操
  - 舞蹈教学
  - 访谈
  - 专访
  - 对谈
  - 对话
  - 做客
  - 夜话
  - 面对面
  - 圆桌
  - 论坛
  - 访谈录
  - 对话录
  - 深度对话
  # --- 2026-09-03 用户确认新增（P1/P2/P4/P6-剧情娱乐）---
  # P1 数字人/话术党
  - 躺赢
  - 偷偷收藏
  - 越少人知道
  # P2 同行卖课/引流号
  - 变现指南
  - 素材公式
  - 2分钟教会
  # P4 贷款/理财引流
  - 6大套路
  - 6大骗局
  - 贷款骗局
  # P6 剧情娱乐/整蛊搞笑/发疯（不含地域/同城词，城市认知保留）
  - 整蛊
  - 发疯
  - 搞笑段子
  - 剧情挑战
  - 街头采访

notes: |
  禅商只是人设，不是内容领域。
  刘总方向用：商业/老板 + 融资/企业服务/避坑/行业信息。
  排除=标题/关键词命中就跳过，不当范文，也不转写（1.7 起先杀再转）。
  访谈/对谈/对话/专访：重策划对谈，没法单人口播模仿。
  跳舞/变装/BGM/翻唱等：强无口播，转写前杀掉。
  数字人/数字分身：教程和工具片，不是口播范文。
  不要加「卡点」「跟练」「vlog」——会误伤口播干货。
  实习生/找工作：不要排除，主题进「职场」，不要丢进商业。
